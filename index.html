<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dudpay - Login & Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col justify-between p-6">

    <div class="max-w-md mx-auto w-full flex-grow flex flex-col justify-center">

        <!-- LOGIN SCREEN -->
        <div id="login-screen" class="space-y-6">
            <div class="text-center space-y-3">
                <div class="inline-flex items-center justify-center w-20 h-20 bg-blue-600 text-white text-3xl font-extrabold rounded-2xl shadow-lg">
                    D
                </div>
                <h1 class="text-2xl font-bold tracking-wide text-slate-900">DUDPAY</h1>
                <p class="text-xs text-slate-400 uppercase tracking-widest font-semibold">Digital Payment</p>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-4 bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                <div class="relative flex items-center">
                    <span class="absolute left-4 text-slate-400"><i class="fa-solid fa-phone"></i></span>
                    <input type="tel" id="login-phone" required placeholder="Phone Number" class="w-full bg-slate-50 border border-slate-200 rounded-2xl py-3.5 pl-12 pr-4 text-sm text-slate-800 focus:outline-none focus:border-emerald-500">
                </div>

                <div class="relative flex items-center">
                    <span class="absolute left-4 text-slate-400"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" id="login-password" required placeholder="Password" class="w-full bg-slate-50 border border-slate-200 rounded-2xl py-3.5 pl-12 pr-4 text-sm text-slate-800 focus:outline-none focus:border-emerald-500">
                </div>

                <div class="flex justify-between items-center text-sm pt-1 px-1">
                    <button type="button" onclick="showRegister()" class="text-emerald-600 font-medium hover:underline">Register New Account</button>
                </div>

                <div class="flex items-center space-x-2 pt-2 px-1 text-xs text-slate-500">
                    <input type="checkbox" checked required class="rounded border-slate-300 text-emerald-600">
                    <span>Agree <a href="#" class="text-emerald-600 underline">User Privacy Agreement</a></span>
                </div>

                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-3.5 rounded-2xl transition shadow-lg shadow-emerald-600/20 text-base mt-2">
                    Sign In
                </button>
            </form>
        </div>

        <!-- REGISTER SCREEN -->
        <div id="register-screen" class="hidden space-y-6">
            <div class="flex items-center space-x-4">
                <button type="button" onclick="showLogin()" class="text-emerald-600 text-lg p-2">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
                <h2 class="text-xl font-bold text-slate-900">Create Account</h2>
            </div>

            <form onsubmit="handleRegister(event)" class="space-y-4 bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                <div class="relative flex items-center">
                    <span class="absolute left-4 text-slate-400"><i class="fa-regular fa-user"></i></span>
                    <input type="text" id="reg-name" required placeholder="User Name" class="w-full bg-slate-50 border border-slate-200 rounded-2xl py-3.5 pl-12 pr-4 text-sm text-slate-800 focus:outline-none focus:border-emerald-500">
                </div>

                <div class="relative flex items-center">
                    <span class="absolute left-4 text-slate-400"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" id="reg-password" required placeholder="Password" class="w-full bg-slate-50 border border-slate-200 rounded-2xl py-3.5 pl-12 pr-4 text-sm text-slate-800 focus:outline-none focus:border-emerald-500">
                </div>

                <div class="relative flex items-center">
                    <span class="absolute left-4 text-slate-400"><i class="fa-solid fa-phone"></i></span>
                    <span class="absolute left-12 text-xs font-semibold text-slate-500">+91</span>
                    <input type="tel" id="reg-phone" required placeholder="Phone Number" class="w-full bg-slate-50 border border-slate-200 rounded-2xl py-3.5 pl-24 pr-4 text-sm text-slate-800 focus:outline-none focus:border-emerald-500">
                </div>

                <div class="relative flex items-center">
                    <span class="absolute left-4 text-slate-400"><i class="fa-regular fa-envelope"></i></span>
                    <input type="text" id="reg-otp" required placeholder="OTP Code" class="w-full bg-slate-50 border border-slate-200 rounded-2xl py-3.5 pl-12 pr-24 text-sm text-slate-800 focus:outline-none focus:border-emerald-500">
                    <button type="button" onclick="sendOTP()" class="absolute right-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-4 py-2 rounded-xl font-medium transition">
                        Send
                    </button>
                </div>

                <div class="relative flex items-center">
                    <span class="absolute left-4 text-slate-400"><i class="fa-solid fa-link"></i></span>
                    <input type="text" id="reg-invite" placeholder="Invite Code (Optional)" class="w-full bg-slate-50 border border-slate-200 rounded-2xl py-3.5 pl-12 pr-4 text-sm text-slate-800 focus:outline-none focus:border-emerald-500">
                </div>

                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-3.5 rounded-2xl transition shadow-lg shadow-emerald-600/20 text-base mt-2">
                    Sign Up
                </button>
            </form>
        </div>

        <!-- DASHBOARD (Appears after successful login) -->
        <div id="dashboard-screen" class="hidden space-y-6 text-center">
            <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-100 space-y-4">
                <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-2xl font-bold">
                    <i class="fa-solid fa-check"></i>
                </div>
                <h2 class="text-2xl font-bold text-slate-900">Welcome, <span id="user-display-name">User</span>!</h2>
                <p class="text-sm text-slate-500">You are successfully logged in to Dudpay.</p>
                <button onclick="handleLogout()" class="w-full bg-red-500 hover:bg-red-600 text-white font-medium py-3 rounded-2xl transition text-sm">
                    Logout
                </button>
            </div>
        </div>

    </div>

    <footer class="text-center text-xs text-slate-400 py-4">
        v1.0.3
    </footer>

    <script>
        let generatedOTP = "";

        function showRegister() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('register-screen').classList.remove('hidden');
        }

        function showLogin() {
            document.getElementById('register-screen').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
        }

        function sendOTP() {
            const phone = document.getElementById('reg-phone').value;
            if(!phone || phone.length < 10) {
                alert('Please enter a valid 10-digit phone number first!');
                return;
            }
            generatedOTP = Math.floor(1000 + Math.random() * 9000).toString();
            alert('Your verification OTP is: ' + generatedOTP);
        }

        function handleRegister(event) {
            event.preventDefault();
            const name = document.getElementById('reg-name').value;
            const password = document.getElementById('reg-password').value;
            const phone = document.getElementById('reg-phone').value;
            const otp = document.getElementById('reg-otp').value;

            if(otp !== generatedOTP) {
                alert('Invalid OTP! Please check the OTP sent to you.');
                return;
            }

            // Save user data in phone storage
            localStorage.setItem('dudpay_phone', phone);
            localStorage.setItem('dudpay_password', password);
            localStorage.setItem('dudpay_name', name);

            alert('Registration Successful! Please login with your details.');
            showLogin();
        }

        function handleLogin(event) {
            event.preventDefault();
            const phone = document.getElementById('login-phone').value;
            const password = document.getElementById('login-password').value;

            const savedPhone = localStorage.getItem('dudpay_phone');
            const savedPass = localStorage.getItem('dudpay_password');
            const savedName = localStorage.getItem('dudpay_name') || 'User';

            if(!savedPhone) {
                alert('No account found! Please register first.');
                showRegister();
                return;
            }

            if(phone === savedPhone && password === savedPass) {
                document.getElementById('user-display-name').innerText = savedName;
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('dashboard-screen').classList.remove('hidden');
            } else {
                alert('Incorrect Phone Number or Password!');
            }
        }

        function handleLogout() {
            document.getElementById('dashboard-screen').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('login-phone').value = '';
            document.getElementById('login-password').value = '';
        }
    </script>
</body>
    </html>
