<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dudpay - Login & Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col justify-between p-6">

    <div class="max-w-md mx-auto w-full flex-grow flex flex-col justify-center">

        <!-- LOGIN SCREEN -->
        <div id="login-screen" class="space-y-6">
            <!-- Logo & Header -->
            <div class="text-center space-y-3">
                <div class="inline-flex items-center justify-center w-20 h-20 bg-blue-600 text-white text-3xl font-extrabold rounded-2xl shadow-lg">
                    D
                </div>
                <h1 class="text-2xl font-bold tracking-wide text-slate-900">DUDPAY</h1>
                <p class="text-xs text-slate-400 uppercase tracking-widest font-semibold">Digital Payment</p>
            </div>

            <!-- Login Form Container -->
            <form onsubmit="handleLogin(event)" class="space-y-4 bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                <!-- Phone Field -->
                <div class="relative flex items-center">
                    <span class="absolute left-4 text-slate-400">
                        <i class="fa-regular fa-user"></i>
                    </span>
                    <input type="tel" required placeholder="Phone" class="w-full bg-slate-50 border border-slate-200 rounded-2xl py-3.5 pl-12 pr-4 text-sm text-slate-800 focus:outline-none focus:border-emerald-500 transition">
                </div>

                <!-- Password Field -->
                <div class="relative flex items-center">
                    <span class="absolute left-4 text-slate-400">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" required placeholder="Password" class="w-full bg-slate-50 border border-slate-200 rounded-2xl py-3.5 pl-12 pr-4 text-sm text-slate-800 focus:outline-none focus:border-emerald-500 transition">
                </div>

                <!-- Extra Options (Register & Remember Me) -->
                <div class="flex justify-between items-center text-sm pt-1 px-1">
                    <button type="button" onclick="showRegister()" class="text-emerald-600 font-medium hover:underline">Register</button>
                    <label class="flex items-center space-x-2 text-slate-500 text-xs cursor-pointer">
                        <input type="checkbox" class="rounded border-slate-300 text-emerald-600 focus:ring-emerald-500">
                        <span>Remember Me</span>
                    </label>
                </div>

                <!-- Privacy Agreement -->
                <div class="flex items-center space-x-2 pt-2 px-1 text-xs text-slate-500">
                    <input type="checkbox" checked class="rounded border-slate-300 text-emerald-600 focus:ring-emerald-500">
                    <span>Agree <a href="#" class="text-emerald-600 underline">User Privacy Agreement</a></span>
                </div>

                <!-- Sign In Button -->
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-3.5 rounded-2xl transition shadow-lg shadow-emerald-600/20 text-base mt-2">
                    Sign In
                </button>

                <!-- Forget Password -->
                <div class="text-center pt-2">
                    <a href="#" onclick="alert('Password reset link sent to your phone'); return false;" class="text-xs text-emerald-600 hover:underline">Forget Password</a>
                </div>
            </form>
        </div>

        <!-- REGISTER SCREEN (Hidden by default) -->
        <div id="register-screen" class="hidden space-y-6">
            <!-- Header with Back Arrow -->
            <div class="flex items-center space-x-4">
                <button onclick="showLogin()" class="text-emerald-600 text-lg p-2">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
                <h2 class="text-xl font-bold text-slate-900">Register</h2>
            </div>

            <!-- Register Form Container -->
            <form onsubmit="handleRegister(event)" class="space-y-4 bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                <!-- User Name -->
                <div class="relative flex items-center">
                    <span class="absolute left-4 text-slate-400">
                        <i class="fa-regular fa-user"></i>
                    </span>
                    <input type="text" required placeholder="User Name" class="w-full bg-slate-50 border border-slate-200 rounded-2xl py-3.5 pl-12 pr-4 text-sm text-slate-800 focus:outline-none focus:border-emerald-500 transition">
                </div>

                <!-- Password -->
                <div class="relative flex items-center">
                    <span class="absolute left-4 text-slate-400">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" required placeholder="Password" class="w-full bg-slate-50 border border-slate-200 rounded-2xl py-3.5 pl-12 pr-4 text-sm text-slate-800 focus:outline-none focus:border-emerald-500 transition">
                </div>

                <!-- Phone with +91 -->
                <div class="relative flex items-center">
                    <span class="absolute left-4 text-slate-400">
                        <i class="fa-solid fa-phone"></i>
                    </span>
                    <span class="absolute left-12 text-xs font-semibold text-slate-500">+91</span>
                    <input type="tel" required placeholder="Phone" class="w-full bg-slate-50 border border-slate-200 rounded-2xl py-3.5 pl-24 pr-4 text-sm text-slate-800 focus:outline-none focus:border-emerald-500 transition">
                </div>

                <!-- OTP Code -->
                <div class="relative flex items-center">
                    <span class="absolute left-4 text-slate-400">
                        <i class="fa-regular fa-envelope"></i>
                    </span>
                    <input type="text" required placeholder="OTP Code" class="w-full bg-slate-50 border border-slate-200 rounded-2xl py-3.5 pl-12 pr-24 text-sm text-slate-800 focus:outline-none focus:border-emerald-500 transition">
                    <button type="button" onclick="alert('OTP sent successfully!')" class="absolute right-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-4 py-2 rounded-xl font-medium transition">
                        Send
                    </button>
                </div>

                <!-- Invite Code -->
                <div class="relative flex items-center">
                    <span class="absolute left-4 text-slate-400">
                        <i class="fa-solid fa-link"></i>
                    </span>
                    <input type="text" placeholder="Invite Code" class="w-full bg-slate-50 border border-slate-200 rounded-2xl py-3.5 pl-12 pr-4 text-sm text-slate-800 focus:outline-none focus:border-emerald-500 transition">
                </div>

                <!-- Sign Up Button -->
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-3.5 rounded-2xl transition shadow-lg shadow-emerald-600/20 text-base mt-2">
                    Sign Up
                </button>
            </form>
        </div>

    </div>

    <!-- Footer Version -->
    <footer class="text-center text-xs text-slate-400 py-4">
        v1.0.3
    </footer>

    <!-- JavaScript to toggle between Login & Register -->
    <script>
        function showRegister() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('register-screen').classList.remove('hidden');
        }

        function showLogin() {
            document.getElementById('register-screen').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
        }

        function handleLogin(event) {
            event.preventDefault();
            alert('Login Successful!');
        }

        function handleRegister(event) {
            event.preventDefault();
            alert('Registration Successful! Please sign in.');
            showLogin();
        }
    </script>
</body>
</html>
